name: Build Biller APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ secrets.BILLER_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.BILLER_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > invoicesaver-release.jks

      - name: Create key.properties
        if: ${{ secrets.BILLER_KEYSTORE_B64 != '' }}
        env:
          STORE_PASS: ${{ secrets.BILLER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILLER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BILLER_KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storeFile=invoicesaver-release.jks
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Create google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS_JSON" > app/google-services.json

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Build signed release APK
        if: ${{ secrets.BILLER_KEYSTORE_B64 != '' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: biller-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
